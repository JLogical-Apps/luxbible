name: bible
description: "A new Flutter project."
publish_to: 'none'

version: 0.5.0+46

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  xml: ^7.0.1
  collection: ^1.19.1
  shared_preferences: ^2.5.3
  recase: ^4.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  material_symbols_icons: ^4.2928.0
  flutter_slidable: ^4.0.3
  rounded_background_text: ^0.6.0
  flutter_tailwind_colors: ^0.0.3
  equatable: ^2.0.5
  intersperse: ^2.0.0
  flutter_sticky_header: ^0.8.0
  another_flushbar: ^2.2.4
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  sticky_headers: ^0.3.0+2
  flutter_native_splash: ^2.4.7
  uuid: ^4.5.3
  package_info_plus: ^10.1.0
  timeago: ^3.7.1
  shimmer: ^3.0.0
  animated_size_and_fade: ^5.1.1
  dio: ^5.9.2
  smooth_page_indicator: ^2.0.1
  port:
    git:
      url: https://github.com/JLogical-Apps/flood.git
      ref: "89a170167523e52354afe3646841e28216b9210a"
      path: packages/port/port
  utils_core:
    git:
      url: https://github.com/JLogical-Apps/flood.git
      ref: "89a170167523e52354afe3646841e28216b9210a"
      path: packages/utils/utils_core
  fuzzywuzzy: ^1.2.0
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  html: ^0.15.6
  modal_bottom_sheet: ^3.0.0

dependency_overrides:
  path_provider_foundation: 2.5.1 # https://stackoverflow.com/questions/79893370/ios-transporter-executable-references-an-unsupported-platform-in-the-arm64-s

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.7.1
  riverpod_lint: ^3.0.3
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0

flutter:
  uses-material-design: true
  config:
    enable-lldb-debugging: false
  assets:
    - assets/translations/
    - assets/strongs/
    - assets/dictionary/
    - assets/commentary/
    - assets/cross_references/
    - assets/bible_plans/
    - fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Italic.ttf
          style: italic
    - family: Bitter
      fonts:
        - asset: fonts/Bitter-VariableFont_wght.ttf
    - family: Lora
      fonts:
        - asset: fonts/Lora-VariableFont_wght.ttf
        - asset: fonts/Lora-Italic-VariableFont_wght.ttf
          style: italic
    - family: Merriweather
      fonts:
        - asset: fonts/Merriweather-VariableFont.ttf
        - asset: fonts/Merriweather-Italic-VariableFont.ttf
          style: italic
    - family: PT Serif
      fonts:
        - asset: fonts/PTSerif-Regular.ttf
        - asset: fonts/PTSerif-Italic.ttf
          style: italic
    - family: Open Sans
      fonts:
        - asset: fonts/OpenSans-VariableFont.ttf
        - asset: fonts/OpenSans-Italic-VariableFont.ttf
          style: italic
    - family: Lato
      fonts:
        - asset: fonts/Lato-Regular.ttf
        - asset: fonts/Lato-Italic.ttf
          style: italic
    - family: OpenDyslexic
      fonts:
        - asset: fonts/OpenDyslexic-Regular.ttf
        - asset: fonts/OpenDyslexic-Italic.ttf
          style: italic
        - asset: fonts/OpenDyslexic-Bold.ttf
          weight: 700
        - asset: fonts/OpenDyslexic-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Ezra SIL SR
      fonts:
        - asset: fonts/EzraSILSR.ttf