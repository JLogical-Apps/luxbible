name: reels
description: Code-defined short-form video editor and renderer for Lux.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.0
  flutter_hooks: ^0.21.3+1
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_macos_video: ^1.1.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 1.2.6 crashes on hot restart: its cleanup quits the old mpv player, which calls back into the dead isolate. Fixed
# upstream in this commit; drop the override once a release includes it.
dependency_overrides:
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit
      path: media_kit
      ref: c35be8bd3073772e578d20fa7bfa044eac2958a1

flutter:
  uses-material-design: true
