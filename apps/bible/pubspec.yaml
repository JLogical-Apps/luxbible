      url: https://github.com/JLogical-Apps/flood.git
      ref: "89a170167523e52354afe3646841e28216b9210a"
      path: packages/utils/utils_core
  fuzzywuzzy: ^1.2.0
  font_awesome_flutter: ^11.0.0
