  timezone: ^0.11.1
  permission_handler: ^13.0.1
  app_settings: ^9.0.0
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.7.1
  riverpod_lint: ^3.0.3
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.11.1
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
flutter:
  uses-material-design: true
  config:
    enable-lldb-debugging: false
  assets:
    - assets/
    - assets/translations/asv/
    - assets/translations/bsb/
    - assets/translations/byz/
    - assets/translations/csb/
    - assets/translations/fob/
    - assets/translations/kjv/
    - assets/translations/lxx/
    - assets/translations/martin1744/
    - assets/translations/nld1939/
    - assets/translations/oshb/
    - assets/translations/rvg/
    - assets/translations/statresgnt/
    - assets/translations/sv/
    - assets/translations/tr/
    - assets/strongs/
    - assets/dictionary/
    - assets/commentary/
    - assets/cross_references/
    - assets/bible_plans/
    - assets/audio_bible_timings/
    - assets/images/
    - fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Italic.ttf
          style: italic
    - family: Bitter
      fonts:
        - asset: fonts/Bitter-VariableFont_wght.ttf
    - family: Lora
      fonts:
        - asset: fonts/Lora-VariableFont_wght.ttf
        - asset: fonts/Lora-Italic-VariableFont_wght.ttf
          style: italic
    - family: Merriweather
      fonts:
        - asset: fonts/Merriweather-VariableFont.ttf
        - asset: fonts/Merriweather-Italic-VariableFont.ttf
          style: italic
    - family: PT Serif
      fonts:
        - asset: fonts/PTSerif-Regular.ttf
        - asset: fonts/PTSerif-Italic.ttf
          style: italic
    - family: Open Sans
      fonts:
        - asset: fonts/OpenSans-VariableFont.ttf
        - asset: fonts/OpenSans-Italic-VariableFont.ttf
          style: italic
    - family: Lato
      fonts:
        - asset: fonts/Lato-Regular.ttf
        - asset: fonts/Lato-Italic.ttf
          style: italic
    - family: OpenDyslexic
      fonts:
        - asset: fonts/OpenDyslexic-Regular.ttf
        - asset: fonts/OpenDyslexic-Italic.ttf
          style: italic
        - asset: fonts/OpenDyslexic-Bold.ttf
          weight: 700
        - asset: fonts/OpenDyslexic-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Ezra SIL SR
      fonts:
        - asset: fonts/EzraSILSR.ttf
