    path: ../../packages/lux
  style:
    path: ../../packages/style
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  xml: ^7.0.1
  collection: ^1.19.1
  shared_preferences: ^2.5.3
